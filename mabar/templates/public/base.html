<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Website Mabar{% endblock %}</title>


    <!-- Tailwind CSS via CDN -->
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <!-- Tabler Icon -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@latest/dist/tabler-icons.min.css" />

</head>
<body>


<!-- Navbar -->
<nav class="bg-gray-900 text-white">
    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
        <div class="flex items-center justify-between h-16">
            <div class="flex items-center">
                <a class="text-xl font-bold" href="{% url 'mabar_list' %}">Website Mabar</a>
                <div class="ml-10 flex items-baseline space-x-4">
                    <a class="px-3 py-2 rounded-md text-sm font-medium {% if request.resolver_match.url_name == 'mabar_list' %}bg-gray-800{% endif %}" href="{% url 'mabar_list' %}">Daftar Mabar</a>
                    <a class="px-3 py-2 rounded-md text-sm font-medium {% if request.resolver_match.url_name == 'bonus_skin_list' %}bg-gray-800{% endif %}" href="{% url 'bonus_skin_list' %}">Daftar Bonus Skin</a>
                    <a class="px-3 py-2 rounded-md text-sm font-medium {% if request.resolver_match.url_name == 'request_hero_list' %}bg-gray-800{% endif %}" href="{% url 'request_hero_list' %}">Daftar Request Hero</a>
                </div>
            </div>
        </div>
    </div>
</nav>


<div class="max-w-7xl mx-auto mt-8 px-4">
    {% block content %}
    {% endblock %}
</div>

<!-- No Bootstrap JS needed, Tailwind is used -->
</body>
</html>
