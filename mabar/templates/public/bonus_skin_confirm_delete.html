{% extends 'public/base.html' %}

{% block title %}Hapus Bonus Skin{% endblock %}

{% block content %}
<div class="max-w-xl mx-auto mt-8 neu-card p-8">
    <h1 class="text-2xl font-bold mb-4">Konfirmasi Hapus Bonus Skin</h1>
    <form method="post">
        {% csrf_token %}
        <p>Apakah Anda yakin ingin menghapus bonus skin <b>{{ skin }}</b>?</p>
        <div class="flex items-center gap-4 mt-4">
            <button type="submit" class="neu-btn text-red-600 font-semibold px-6 py-2">Hapus</button>
            <a href="{% url 'bonus_skin_list' %}" class="neu-btn text-gray-600 font-semibold px-6 py-2">Batal</a>
        </div>
    </form>
</div>
{% endblock %}
